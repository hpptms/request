<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>広告</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <script>
      // This page exists so admax's RTB pipeline (its own scripts, plus
      // whichever exchange/advertiser wins each auction — Criteo, PubMatic,
      // AdStir, ... with their own inline <script> blocks) can run without
      // request.tokyo's site-wide CSP growing a new entry every time a
      // different ad happens to win (see nginx.conf / _headers, where this
      // path has no Content-Security-Policy of its own at all). Safety
      // instead comes from this page being served from a dedicated
      // ads.request.tokyo origin (a second custom domain on the same
      // Cloudflare Pages deployment — see FooterAd.tsx / PcRailAd.tsx /
      // _headers) rather than request.tokyo: ordinary same-origin-policy
      // keeps anything running here from touching request.tokyo's real
      // cookies/localStorage/DOM, regardless of what CSP does or doesn't
      // restrict. The embedding iframe is sandboxed WITH allow-same-origin
      // (safe specifically because the origins genuinely differ) — admax's
      // SDK needs that to render creatives at all, since it works by
      // creating further nested iframes and writing into them via
      // contentWindow.document, which throws once the outer frame is
      // opaque-origin.
      //
      // The tag id is only ever a bare admax hex id, and it ends up
      // directly in a <script src>, so it's validated against a strict
      // allow-list pattern before use — this check is the only guard left
      // against this page being (ab)used as an open script loader via a
      // crafted query string, now that its own CSP is gone.
      var match = /^[a-f0-9]{16,64}$/.exec(new URLSearchParams(location.search).get("tag") || "");
      //
      // Written with document.write (not createElement + appendChild) on
      // purpose: admax's /s/<tag> snippet itself chain-loads st/s.js via
      // document.write, and Chrome silently ignores document.write from a
      // dynamically inserted (= async) script — the snippet would run, set
      // window.admaxbanner/admaxaction, and then never load the SDK, leaving
      // the frame blank with no error. A script written in during this
      // inline script's parse is parser-inserted, so the snippet's own
      // document.write works as in admax's stock embed code.
      if (match) {
        document.write('<script src="https://adm.shinobi.jp/s/' + match[0] + '"><\/script>');
      }
    </script>
  </body>
</html>
