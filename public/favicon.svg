<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 160 160" role="img" aria-label="動画リクエストキュー">
  <title>動画リクエストキュー</title>
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.2" stop-color="#ff9500"/>
      <stop offset="0.4" stop-color="#ffd60a"/>
      <stop offset="0.6" stop-color="#34c759"/>
      <stop offset="0.8" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
  </defs>
  <!-- YouTube-style rounded screen, filled with a rainbow -->
  <rect x="6" y="14" width="148" height="98" rx="30" fill="url(#rb)"/>
  <rect x="6" y="14" width="148" height="98" rx="30" fill="none" stroke="#1b1b2f" stroke-width="4"/>
  <!-- glossy highlight -->
  <path d="M30 26h58" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <!-- nerd glasses: thick frames, taped bridge -->
  <g stroke="#1b1b2f" stroke-width="7">
    <circle cx="52" cy="50" r="19" fill="#fff"/>
    <circle cx="108" cy="50" r="19" fill="#fff"/>
  </g>
  <path d="M71 47q9-6 18 0" fill="none" stroke="#1b1b2f" stroke-width="6" stroke-linecap="round"/>
  <rect x="73" y="43" width="14" height="9" rx="2" fill="#f5f0e1" stroke="#1b1b2f" stroke-width="2" transform="rotate(-6 80 48)"/>
  <path d="M33 47l-14-5M127 47l14-5" stroke="#1b1b2f" stroke-width="6" stroke-linecap="round"/>
  <!-- pupils looking down-right at the play button -->
  <circle cx="57" cy="55" r="7" fill="#1b1b2f"/>
  <circle cx="113" cy="55" r="7" fill="#1b1b2f"/>
  <circle cx="60" cy="52" r="2.4" fill="#fff"/>
  <circle cx="116" cy="52" r="2.4" fill="#fff"/>
  <!-- play button as the mouth -->
  <path d="M68 78l28 15-28 15z" fill="#fff" stroke="#1b1b2f" stroke-width="5" stroke-linejoin="round" transform="translate(-2 -4)"/>
  <!-- sparkles -->
  <path d="M138 78l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff" stroke="#1b1b2f" stroke-width="2" stroke-linejoin="round"/>
</svg>
