server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth against XSS and clickjacking: this SPA renders all
    # user-supplied data (video titles, requester names, ...) as plain React
    # text nodes, never HTML, so there's no first-party injection point today
    # — but a strict CSP means a future mistake (or a compromised dependency)
    # still can't load an external script or exfiltrate via a stray tag.
    # script-src/frame-src allow www.youtube.com for the IFrame Player API
    # and the embedded player, plus the plain-iframe embeds for niconico/
    # vimeo (see ViewerPage's nonYouTubeEmbedUrl — those platforms are shown
    # as a bare <iframe>, no script-src needed since their own scripts run
    # inside that frame's own origin/CSP); style-src needs 'unsafe-inline'
    # because MUI's emotion runtime injects <style> tags rather than using a
    # nonce. script-src/connect-src also allow googletagmanager.com/
    # google-analytics.com for the gtag.js pageview tracking in index.html —
    # without these the browser silently blocks the tag and Analytics never
    # sees the visit. connect-src also lists the bare analytics.google.com
    # and www.google.com hosts (not just the *.google-analytics.com/
    # *.analytics.google.com wildcards) because gtag.js actually sends its
    # collect hits there — a wildcard like *.analytics.google.com does NOT
    # match the bare analytics.google.com, so without this gtag.js/boot.js
    # loaded fine but every hit was silently dropped by the CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://static.cloudflareinsights.com https://fundingchoicesmessages.google.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com https://*.nimg.jp https://*.vimeocdn.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.co.jp; frame-src https://www.youtube.com https://embed.nicovideo.jp https://player.vimeo.com https://googleads.g.doubleclick.net https://*.googlesyndication.com https://www.google.com https://*.adtrafficquality.google; connect-src 'self' https://cloudflareinsights.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.co.jp; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # $http_host keeps the port (localhost:8090): the backend's CSRF
        # guard (api.Server.sameOrigin) compares Origin against it, so $host,
        # which drops the port, would get every same-origin write refused.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mirrors public/_redirects: the /report page was removed (see there).
    location ~ ^/report/?$ {
        return 301 /;
    }

    location / {
        try_files $uri /index.html;
    }
}
