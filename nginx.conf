server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth against XSS and clickjacking: this SPA renders all
    # user-supplied data (video titles, requester names, ...) as plain React
    # text nodes, never HTML, so there's no first-party injection point today
    # — but a strict CSP means a future mistake (or a compromised dependency)
    # still can't load an external script or exfiltrate via a stray tag.
    # script-src/frame-src allow www.youtube.com for the IFrame Player API
    # and the embedded player, plus the plain-iframe embeds for niconico/
    # vimeo (see ViewerPage's nonYouTubeEmbedUrl — those platforms are shown
    # as a bare <iframe>, no script-src needed since their own scripts run
    # inside that frame's own origin/CSP); style-src needs 'unsafe-inline'
    # because MUI's emotion runtime injects <style> tags rather than using a
    # nonce. script-src/connect-src also allow googletagmanager.com/
    # google-analytics.com for the gtag.js pageview tracking in index.html —
    # without these the browser silently blocks the tag and Analytics never
    # sees the visit. connect-src also lists the bare analytics.google.com
    # and www.google.com hosts (not just the *.google-analytics.com/
    # *.analytics.google.com wildcards) because gtag.js actually sends its
    # collect hits there — a wildcard like *.analytics.google.com does NOT
    # match the bare analytics.google.com, so without this gtag.js/boot.js
    # loaded fine but every hit was silently dropped by the CSP.
    # The admax (Shinobi Tools) ads (FooterAd.tsx, PcRailAd.tsx) used to run
    # directly in this document, but its RTB pipeline — its own scripts,
    # plus whichever exchange/advertiser wins each auction, each with their
    # own domains and inline <script> blocks — kept needing new script-src/
    # img-src/connect-src entries here every time a different ad happened
    # to win, since an about:blank iframe (which is how admax renders a
    # creative) inherits the CSP of whatever page created it. Both ad units
    # now load in a sandboxed same-origin iframe pointed at /ad/banner.html
    # instead (see that file, and FooterAd.tsx/PcRailAd.tsx) — that path
    # gets no Content-Security-Policy header at all below (nginx doesn't
    # inherit add_header into a location that sets its own, so simply not
    # setting one there is enough), so this policy no longer needs any
    # admax-specific entries. frame-src 'self' below is so the main
    # document is allowed to embed that page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com https://*.nimg.jp https://*.vimeocdn.com; frame-src 'self' https://www.youtube.com https://embed.nicovideo.jp https://player.vimeo.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # admax's ad tags need to run without the site-wide CSP above
    # restricting them (see that rule's comment) — this page is only ever
    # embedded via a sandboxed iframe with no allow-same-origin
    # (FooterAd.tsx/PcRailAd.tsx), so it never runs with request.tokyo's
    # real origin regardless of what it's allowed to load. No
    # Content-Security-Policy is set here at all (see above).
    # X-Frame-Options is relaxed to SAMEORIGIN (from the site-wide DENY)
    # only so request.tokyo itself can embed this one path.
    location /ad/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
