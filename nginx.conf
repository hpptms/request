server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth against XSS and clickjacking: this SPA renders all
    # user-supplied data (video titles, requester names, ...) as plain React
    # text nodes, never HTML, so there's no first-party injection point today
    # — but a strict CSP means a future mistake (or a compromised dependency)
    # still can't load an external script or exfiltrate via a stray tag.
    # script-src/frame-src allow www.youtube.com for the IFrame Player API
    # and the embedded player, plus the plain-iframe embeds for niconico/
    # bilibili/vimeo (see ViewerPage's nonYouTubeEmbedUrl — those platforms
    # are shown as a bare <iframe>, no script-src needed since their own
    # scripts run inside that frame's own origin/CSP); style-src needs
    # 'unsafe-inline' because MUI's emotion runtime injects <style> tags
    # rather than using a nonce.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com https://*.nimg.jp https://*.vimeocdn.com; frame-src https://www.youtube.com https://embed.nicovideo.jp https://player.bilibili.com https://player.vimeo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
