server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth against XSS and clickjacking: this SPA renders all
    # user-supplied data (video titles, requester names, ...) as plain React
    # text nodes, never HTML, so there's no first-party injection point today
    # — but a strict CSP means a future mistake (or a compromised dependency)
    # still can't load an external script or exfiltrate via a stray tag.
    # script-src/frame-src allow www.youtube.com for the IFrame Player API
    # and the embedded player, plus the plain-iframe embeds for niconico/
    # vimeo (see ViewerPage's nonYouTubeEmbedUrl — those platforms are shown
    # as a bare <iframe>, no script-src needed since their own scripts run
    # inside that frame's own origin/CSP); style-src needs 'unsafe-inline'
    # because MUI's emotion runtime injects <style> tags rather than using a
    # nonce. script-src/connect-src also allow googletagmanager.com/
    # google-analytics.com for the gtag.js pageview tracking in index.html —
    # without these the browser silently blocks the tag and Analytics never
    # sees the visit. connect-src also lists the bare analytics.google.com
    # and www.google.com hosts (not just the *.google-analytics.com/
    # *.analytics.google.com wildcards) because gtag.js actually sends its
    # collect hits there — a wildcard like *.analytics.google.com does NOT
    # match the bare analytics.google.com, so without this gtag.js/boot.js
    # loaded fine but every hit was silently dropped by the CSP.
    # script-src also allows adm.shinobi.jp/cnobi.jp for the PC-only admax
    # sticky-right ad loaded from boot.js, plus the fixed infra domains its
    # SDK calls out to before it ever picks a creative: dmp.im-apps.net
    # (user-id sync SDK), sync.shinobi.jp (cookie sync), and one inline
    # bootstrap script admitted by hash
    # (sha256-wAJZvpYF7i/hQGqXEF66seLFmPkYlUnRF1/om9+msWg=) rather than
    # 'unsafe-inline'. img-src similarly allows adm.shinobi.jp itself (its
    # /ib impression beacon) and the cookie-sync pixels of the ad exchanges
    # admax's RTB auction calls out to: bidswitch.net, ad-stir.com,
    # dsp.bance.jp, fout.jp. These were all found by opening request.tokyo
    # with devtools open and reading the actual CSP violation errors — the
    # SDK's bootstrap couldn't finish without them, so ads weren't just
    # showing a blank creative, the auction pipeline itself never completed.
    # Deliberately NOT widening img-src/frame-src further for the winning
    # ad's own creative domain, since that rotates per-advertiser and isn't
    # a fixed, enumerable set like the domains above; see boot.js.
    # Also admax infra, found in a second devtools pass after the fix above:
    # pb.shinobi.jp (script-src) is admax's passback loader — when the RTB
    # auction has no winner, the /b/ response's tag_text loads
    # pb.shinobi.jp/st/r.js + /t/<id> into the ad's about:blank iframe, which
    # inherits this page's CSP, so it was blocked there. audiencedata.im-apps.net
    # (connect-src) is the endpoint dmp.im-apps.net's im-uid.js SDK fetches the
    # user id from. The passback waterfall pb.shinobi.jp returns (Criteo /
    # PubMatic / AdStir scripts plus inline <script> blocks) is the rotating
    # creative side and is intentionally NOT listed here either.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://www.googletagmanager.com https://adm.shinobi.jp https://cnobi.jp https://dmp.im-apps.net https://sync.shinobi.jp https://pb.shinobi.jp 'sha256-wAJZvpYF7i/hQGqXEF66seLFmPkYlUnRF1/om9+msWg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com https://*.nimg.jp https://*.vimeocdn.com https://adm.shinobi.jp https://x.bidswitch.net https://bypass.ad-stir.com https://tr.dsp.bance.jp https://sync.fout.jp; frame-src https://www.youtube.com https://embed.nicovideo.jp https://player.vimeo.com; connect-src 'self' https://audiencedata.im-apps.net https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
