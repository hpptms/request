<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches theme.ts's background.default so a mobile browser's own
         address/status bar blends with the app instead of showing as a
         mismatched white/grey strip above it. -->
    <meta name="theme-color" content="#0f0f0f" />
    <title>動画リクエストキュー | みんなで一緒に動画を見るリクエストサイト</title>

    <!-- Sitewide defaults for crawlers and link previews. Each public page
         (BoardPage/PlayPage/StatsPage/...) overwrites description/canonical/
         og:* for its own route once it mounts, via src/lib/useSeo.ts — this
         is a client-rendered SPA with no server-side rendering, so these
         tags are what's present before/without JS, and also what a page
         without its own useSeo call (ViewerPage, AdminPage) keeps. -->
    <meta name="description" content="動画リクエストキューは、リクエスタ(リクエスター)がYouTube・ニコニコ動画・Vimeoの動画をリクエストして、みんなで一緒に動画を見られる視聴者参加型の動画リクエストサイトです。いいね・bad投票でリクエストの再生順が変わります。" />
        <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://request.tokyo/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="動画リクエストキュー" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="動画リクエストキュー | みんなで一緒に動画を見るリクエストサイト" />
    <meta property="og:description" content="動画をリクエストして、みんなで一緒に動画を見よう。YouTube・ニコニコ動画・Vimeoに対応した視聴者参加型の動画リクエストサイト。" />
    <meta property="og:url" content="https://request.tokyo/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="動画リクエストキュー | みんなで一緒に動画を見るリクエストサイト" />
    <meta name="twitter:description" content="動画をリクエストして、みんなで一緒に動画を見よう。YouTube・ニコニコ動画・Vimeoに対応した視聴者参加型の動画リクエストサイト。" />
    <meta property="og:image" content="https://request.tokyo/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="動画リクエストキュー — みんなで一緒に動画を見よう" />
    <meta name="twitter:image" content="https://request.tokyo/ogp.png" />
    <meta name="twitter:site" content="@request_tokyo" />

    <!-- Structured data (a data block, not a script that runs, so the CSP's
         script-src doesn't affect it). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "動画リクエストキュー",
        "alternateName": ["動画リクエスト", "みんなで一緒に動画を見るリクエストサイト"],
        "url": "https://request.tokyo/",
        "inLanguage": "ja",
        "description": "動画リクエストキューは、リクエスタ(リクエスター)がYouTube・ニコニコ動画・Vimeoの動画をリクエストして、みんなで一緒に動画を見られる視聴者参加型の動画リクエストサイトです。いいね・bad投票でリクエストの再生順が変わります。",
        "publisher": { "@id": "https://request.tokyo/#organization" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://request.tokyo/#organization",
        "name": "動画リクエストキュー",
        "url": "https://request.tokyo/",
        "logo": "https://request.tokyo/apple-touch-icon.png",
        "sameAs": ["https://x.com/%VITE_X_HANDLE%"]
      }
    </script>

    <!-- Google tag (gtag.js)
         Init code lives in /boot.js (not inline, and deliberately not named
         gtag-init.js — filter lists like EasyPrivacy block first-party
         requests containing "gtag" in the path regardless of domain) because
         the CSP's script-src has no 'unsafe-inline'/nonce/hash, so an inline
         <script> here would be silently blocked by the browser and
         gtag('config', ...) would never fire. The measurement ID is passed
         to it via data-ga-id, since files in public/ aren't processed by
         Vite and so can't read VITE_GA_MEASUREMENT_ID themselves. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script defer src="/boot.js" data-ga-id="%VITE_GA_MEASUREMENT_ID%"></script>

    <!-- Google AdSense. Its origins are allowed in the CSP (nginx.conf /
         public/_headers). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=%VITE_ADSENSE_CLIENT%"
         crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>動画リクエストキュー</h1>
      <p>動画リクエストキューは、リクエスタがYouTube・ニコニコ動画・Vimeoの動画をリクエストして、みんなで一緒に動画を見られる視聴者参加型の動画リクエストサイトです。ご利用にはJavaScriptを有効にしてください。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
